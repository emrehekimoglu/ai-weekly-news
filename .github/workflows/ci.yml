name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Sırlar verilmez: bu iş LLM'i çağırmaz ve e-posta göndermez.
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Derleme ve import kontrolü
        run: |
          python -m py_compile main.py archive.py
          python -c "import main, archive"

      - name: Testler (pytest)
        run: pytest -q

      - name: Worker testleri (node)
        run: cd worker && node --test
