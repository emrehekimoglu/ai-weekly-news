name: Haftalik Teknoloji ve AI Bulteni

on:
  schedule:
    # Her Pazartesi saat 06:00 UTC (TSİ 09:00)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Manuel test butonu
    inputs:
      dry_run:
        description: 'Sadece veri topla (model ve e-posta atlanır)'
        type: boolean
        default: false
      preview:
        description: 'Önizleme: bülteni üret, sadece bana gönder (abonelere gitmez)'
        type: boolean
        default: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    permissions:
      # Gönderilen sayının data/history.json kaydını depoya commit etmek için
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bülteni Oluştur ve Mail Gönder
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          PREVIEW: ${{ inputs.preview }}
          PREVIEW_EMAIL: ${{ secrets.PREVIEW_EMAIL }}
        run: python main.py

      - name: Önizleme HTML'ini Yükle
        if: always() && inputs.preview
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-preview
          path: newsletter.html
          if-no-files-found: ignore

      - name: Sayı Geçmişini Kaydet
        # Sadece gerçek gönderimlerde; önizleme ve dry_run geçmişi değiştirmez
        if: always() && !inputs.preview && !inputs.dry_run
        run: |
          if [ -n "$(git status --porcelain data/history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "Bülten geçmişini güncelle ($(date -u +%F))"
            git push
          fi
