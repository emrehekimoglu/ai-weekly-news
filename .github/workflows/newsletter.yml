name: Haftalik Teknoloji ve AI Bulteni

on:
  schedule:
    # Her Pazartesi saat 03:00 UTC (TSİ 06:00)
    - cron: '0 3 * * 1'
    # Yedek: GitHub saat başı zamanlamaları bazen düşürür. Bu hafta otomatik çalışma zaten
    # gönderdiyse main.py hiçbir şey yapmadan çıkar (elle gönderilen sayılar sayılmaz).
    - cron: '37 4 * * 1'
  workflow_dispatch: # Manuel test butonu
    inputs:
      dry_run:
        description: 'Sadece veri topla (model ve e-posta atlanır)'
        type: boolean
        default: false
      preview:
        description: 'Önizleme: bülteni üret, sadece bana gönder (abonelere gitmez)'
        type: boolean
        default: false
      preview_to:
        description: 'Önizlemeyi bu adrese gönder (boşsa bana; ör. mail-tester.com adresi)'
        type: string
        default: ''
      fallback_test:
        description: 'Yedek modeli dene: ana model bilerek bozulur, önizlemeyi yedek model yazar (sadece bana gider)'
        type: boolean
        default: false
      alert_test:
        description: 'Sadece uyarı e-postasını dene (bülten üretilmez, kimseye bülten gitmez)'
        type: boolean
        default: false

# Aynı anda iki çalışma gh-pages dalına yazmasın
concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    permissions:
      # data/history.json kaydını main'e, arşiv sayfalarını gh-pages dalına commit etmek için
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          # Kuyrukta beklerken commit edilen data/history.json da gelsin (yedek zamanlama bunu kontrol eder)
          ref: ${{ github.ref }}

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bülteni Oluştur ve Mail Gönder
        if: ${{ !inputs.alert_test }}
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          SIGNUP_URL: ${{ secrets.SIGNUP_URL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          # GitHub kaynağı kimlikli arama yapsın; kimliksiz arama paylaşılan runner IP'sinde 403 (hız sınırı) alıyor
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          PREVIEW: ${{ inputs.preview }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PREVIEW_EMAIL: ${{ secrets.PREVIEW_EMAIL }}
          PREVIEW_TO: ${{ inputs.preview_to }}
          FALLBACK_TEST: ${{ inputs.fallback_test }}
        # Çıktı run.log'a da yazılır; hata olursa son satırları uyarı e-postasına girer.
        # "shell: bash" pipefail açar, yani main.py hata verirse adım yine kırmızı olur.
        shell: bash
        run: python -u main.py 2>&1 | tee run.log

      - name: Önizleme HTML'ini Yükle
        if: always() && (inputs.preview || inputs.fallback_test)
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-preview
          path: newsletter.html
          if-no-files-found: ignore

      - name: Sayı Geçmişini Kaydet
        # Sadece gerçek gönderimlerde; önizleme ve dry_run geçmişi değiştirmez
        if: always() && !inputs.preview && !inputs.fallback_test && !inputs.dry_run
        run: |
          # latest-issue.json: yeni okura onayda gönderilen son sayı (Worker GitHub'dan okur)
          if [ -n "$(git status --porcelain data/history.json data/latest-issue.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/history.json $(ls data/latest-issue.json 2>/dev/null)
            git commit -m "Bülten geçmişini güncelle ($(date -u +%F))"
            git push
          fi

      # Sadece abonelere gerçekten gönderilen sayılar arşive girer:
      # newsletter/app.py issue.html dosyasını önizleme ve dry_run'da yazmaz.
      - name: Web Arşivine Ekle (GitHub Pages)
        if: always() && !inputs.dry_run && !inputs.preview && !inputs.fallback_test && hashFiles('issue.html') != ''
        env:
          SIGNUP_URL: ${{ secrets.SIGNUP_URL }}
        run: |
          if git fetch --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages site origin/gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
          python archive.py issue.html site
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "Arşivde değişiklik yok."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Arşiv: $(date -u +%Y-%m-%d) sayısı"
          git push origin gh-pages

      # GitHub zamanlanmış çalışmaların hatasını her zaman bildirmiyor. Gerçek gönderimde bir adım
      # başarısız olursa veya bir kaynak boş dönerse (ya da yedek model kullanılırsa) sahibine e-posta gider.
      - name: Sorun Varsa Bana Haber Ver
        if: always() && !inputs.preview && !inputs.fallback_test && !inputs.dry_run
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          PREVIEW_EMAIL: ${{ secrets.PREVIEW_EMAIL }}
          JOB_STATUS: ${{ job.status }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          ALERT_TEST: ${{ inputs.alert_test }}
        run: |
          if [ "$ALERT_TEST" = "true" ]; then
            python -m newsletter.alert --test
          else
            python -m newsletter.alert --status "$JOB_STATUS" --log run.log
          fi
