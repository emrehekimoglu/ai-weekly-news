name: Haftalik Teknoloji ve AI Bulteni

on:
  schedule:
    # Her Pazartesi saat 06:00 UTC (TSİ 09:00)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Test edebilmeniz için manuel "Çalıştır" butonu sağlar

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bülteni Oluştur ve Mail Gönder
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python main.py
